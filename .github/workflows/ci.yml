name: CI - dbt build on pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:          # also allows a manual run from the Actions tab

concurrency:                  # a new push to the same PR cancels the older, still-running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Write the Snowflake private key to a temporary file
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/keys/rsa_key.p8"

      - name: Build the Docker image
        run: docker build -t pipeline:ci .

      - name: dbt build (models + tests) into DBT_CI
        run: |
          docker run --rm \
            -e SNOWFLAKE_ACCOUNT -e SNOWFLAKE_USER -e SNOWFLAKE_ROLE \
            -e SNOWFLAKE_WAREHOUSE -e SNOWFLAKE_DATABASE \
            -e SNOWFLAKE_PRIVATE_KEY_PATH=/keys/rsa_key.p8 \
            -v "$RUNNER_TEMP/keys:/keys:ro" \
            pipeline:ci \
            sh -c "cd finance_dbt && dbt build --target ci"