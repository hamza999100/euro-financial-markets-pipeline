version: 2

models:
  - name: dim_date
    description: "Calendar dimension, one row per day since 2015."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_currency
    description: "Currencies quoted against the euro (from the currencies seed)."
    columns:
      - name: currency_code
        data_tests:
          - unique
          - not_null

  - name: fact_fx_daily
    description: "Daily ECB euro reference rates per currency, with day-over-day change in percent. Incremental (merge)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_date]
    columns:
      - name: currency_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code
      - name: rate_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: eur_fx_rate
        data_tests:
          - not_null