version: 2

models:
  - name: dim_date
    description: "Calendar dimension, one row per day since 2015."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_currency
    description: "Currencies quoted against the euro (from the currencies seed)."
    columns:
      - name: currency_code
        data_tests:
          - unique
          - not_null

  - name: fact_fx_daily
    description: "Daily ECB euro reference rates per currency, with day-over-day change in percent. Incremental (merge)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_date]
    columns:
      - name: currency_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code
      - name: rate_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: eur_fx_rate
        data_tests:
          - not_null

  - name: mart_yield_curve
    description: "Daily German yield curve: 2y and 10y Bund yields, 10y-2y spread (pp), inversion flag, ECB deposit rate."
    columns:
      - name: yield_date
        data_tests:
          - unique
          - not_null
      - name: spread_10y_2y_pp
        data_tests:
          - not_null

  - name: mart_real_interest_rate
    description: "Monthly real interest rate = ECB deposit rate at month-end minus HICP inflation (Germany and euro area)."
    columns:
      - name: month_start_date
        data_tests:
          - unique
          - not_null
      - name: real_rate_de_pct
        data_tests:
          - not_null

  - name: mart_fx_monthly
    description: "Monthly average, min, max and volatility of EUR exchange rates per currency."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, month_start_date]