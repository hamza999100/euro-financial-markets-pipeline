version: 2

models:
  - name: int_calendar_days
    description: "Date spine: one row per calendar day from 2015-01-01 to today."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: int_policy_rate_daily
    description: "ECB deposit facility rate valid on each calendar day (forward-filled via ASOF JOIN)."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: deposit_rate_pct
        data_tests:
          - not_null   # every day since 2015 must have a valid rate